@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b22;--card:#17272f;--ink:#e6eef1;--mut:#9bb0ba;--line:#2a3d47;--y26:#3cc4d2;--y25:#f0b33f;--y24:#7f93a0;--up:#5fd08c;--dn:#ff8a7f;--acc:#3cc4d2;--on:#0b1a20;--tip:#e6eef1;--tipfg:#0f1b22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1b22;--card:#17272f;--ink:#e6eef1;--mut:#9bb0ba;--line:#2a3d47;--y26:#3cc4d2;--y25:#f0b33f;--y24:#7f93a0;--up:#5fd08c;--dn:#ff8a7f;--acc:#3cc4d2;--on:#0b1a20;--tip:#e6eef1;--tipfg:#0f1b22;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif}
.w{max-width:1180px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
h1{font-size:24px;margin:0;font-weight:700}
h2{font-size:15px;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
button{font:inherit;color:var(--ink);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:6px 14px;line-height:1.3}.seg small{display:block;font-size:11px;opacity:.85}
.seg button[aria-pressed=true],.chips button[aria-pressed=true]{background:var(--acc);color:var(--on)}
select,.imp{font:inherit;cursor:pointer;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.kpi .l{color:var(--mut);font-size:13px}
.kpi .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin:2px 0}
.kpi .s{font-size:12px;color:var(--mut)}
.up{color:var(--up)}.dn{color:var(--dn)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.chips button{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 12px;font-size:13px}
.box{position:relative;height:300px;touch-action:pan-y}
.box svg{display:block}
.tip{position:absolute;top:0;pointer-events:none;background:var(--tip);color:var(--tipfg);font-size:12px;line-height:1.5;padding:6px 9px;border-radius:6px;white-space:pre;font-variant-numeric:tabular-nums;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
[hidden]{display:none!important}
.err{background:var(--card);border:1px solid var(--dn);color:var(--dn);border-radius:8px;padding:10px 12px;margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.err.ok{border-color:var(--up);color:var(--up)}
.err button{border:0;background:none;color:inherit;font-size:18px;line-height:1;padding:2px 6px}
.hint{display:none}
.mp{position:relative}
.mbtn{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 32px 7px 10px;position:relative;white-space:nowrap;text-align:left;min-width:150px;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.mbtn::after{content:'';position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:translateY(-70%) rotate(45deg)}
.mpan{position:absolute;right:0;top:calc(100% + 6px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;width:290px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.mpan .pre{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.mpan .pre button{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 11px;font-size:12px}
.mpan .mg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mpan .mg button{border:1px solid var(--line);background:none;border-radius:8px;padding:9px 0;font-size:13px}
.mpan button[aria-pressed=true]{background:var(--acc);color:var(--on);border-color:var(--acc)}
.mpan button:disabled{opacity:.35;cursor:default}
.mpan .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--mut)}
.mpan .ft button{border:0;background:var(--acc);color:var(--on);border-radius:6px;padding:6px 16px}
.kpi .tag{font-size:11px;margin-left:6px;padding:0 6px;border-radius:4px;background:var(--bg);color:var(--mut)}
tr.sum td{font-weight:700;border-top:2px solid var(--line);background:var(--bg)}
@media (max-width:640px){
h1{font-size:20px}
header{align-items:stretch}
.ctl{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctl .imp{grid-column:1/-1;order:9}
.ctl select{width:100%;min-height:40px}
.mp{width:100%}.mbtn{width:100%;min-width:0;max-width:none;min-height:40px}
.mpan{width:min(300px,calc(100vw - 32px))}
.seg{grid-column:1/-1;display:flex}
.seg button{flex:1;padding:7px 4px;min-height:44px}
.seg small{font-size:10px}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card{padding:12px}
.kpi .v{font-size:22px}
.kpi .s{font-size:11px}
.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-12px;margin-right:-12px;padding:0 12px 2px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:6px 12px}
.box{height:260px}
.hint{display:block;color:var(--mut);font-size:11px;margin-top:4px}
th,td{padding:6px 8px}
th:first-child,td:first-child{position:sticky;left:0;background:var(--card)}
}
.grid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;white-space:nowrap}
th,td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500}
tr.cur td{background:var(--bg);font-weight:700}
.note{color:var(--mut);font-size:12px;line-height:1.7}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mut)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
</style></head><body><div class="w">
<header><div><h1>航班營運儀表板</h1><div class="sub" id="sub"></div></div>
<div class="ctl"><button class="imp" id="imp" title="選擇新的 Excel 檔案，直接更新畫面上的數據">匯入 Excel</button><input type="file" id="fi" accept=".xlsx" hidden><select id="yr" aria-label="年份"></select><div class="mp" id="mp"><button class="mbtn" id="mo" aria-haspopup="true" aria-expanded="false" aria-label="月份"></button><div class="mpan" id="mpan" hidden></div></div><div class="seg" id="seg" role="group" aria-label="航向"></div></div></header>
<div class="err" id="err" hidden><span id="errm"></span><button id="errx" aria-label="關閉">×</button></div>
<section class="kpis" id="kpis"></section>
<section class="card" style="margin-bottom:14px">
<h2 id="t1"></h2><div class="chips" id="chips"></div>

<div class="box" id="c1"></div><div class="hint">點圖表上的月份可看數值</div></section>
<section class="card" style="margin-bottom:14px"><h2 id="t2"></h2><div class="chips" id="chips2"></div><div class="lg" id="lg2"></div><div class="box" id="c2"></div><div class="hint">點圖表上的月份可看三年數值</div></section>
<section class="card" style="margin-bottom:14px"><h2 id="t3"></h2><div class="tw"><table id="tb"></table></div></section>
</div>
